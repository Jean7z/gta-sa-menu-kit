name: Android arm64 build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and PSDK submodule
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK r29
        run: sdkmanager 'ndk;29.0.14206865'

      - name: Build arm64-v8a library
        run: "$ANDROID_HOME/ndk/29.0.14206865/ndk-build"

      - name: Verify standalone build output
        run: test -s libs/arm64-v8a/libAML_PSDK_MenuKit64.so

      - name: Build embedded client example
        run: $ANDROID_HOME/ndk/29.0.14206865/ndk-build MENUKIT_EMBEDDED_EXAMPLE=1

      - name: Verify embedded build output
        run: test -s libs/arm64-v8a/libMenuKitEmbeddedExample.so
